<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>終極密碼說謊版</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game">
    <div id="intro">
        <h1>終極密碼說謊版</h1>
        <p class="notice">可能有一次回答是假的……</p>
        <button id="startButton" onclick="showMenu()">準備開始</button>
    </div>

    <div id="menu" style="display:none;">
        <h2>請選擇範圍</h2>
        <button onclick="startGame(20)">0 ~ 20</button>
        <button onclick="startGame(50)">0 ~ 50</button>
        <button onclick="startGame(100)">0 ~ 100</button>
        <button onclick="startGame(200)">0 ~ 200</button>
    </div>

    <div id="game" style="display:none;">
        <p id="range"></p>
        <p id="status"></p>

        <div id="inputDisplay">0</div>

        <div id="keypad">
            <button onclick="pressNumber(1)">1</button>
            <button onclick="pressNumber(2)">2</button>
            <button onclick="pressNumber(3)">3</button>

            <button onclick="pressNumber(4)">4</button>
            <button onclick="pressNumber(5)">5</button>
            <button onclick="pressNumber(6)">6</button>

            <button onclick="pressNumber(7)">7</button>
            <button onclick="pressNumber(8)">8</button>
            <button onclick="pressNumber(9)">9</button>

            <button onclick="deleteNumber()">←</button>
            <button onclick="pressNumber(0)">0</button>
            <button onclick="guess()">✓</button>
        </div>

        <p id="result"></p>
        <p id="cost"></p>

        <div id="history"></div>

        <div id="end">
            <div id="endResult"></div>
            <button onclick="restartGame()">重新開始</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
