<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>終極密碼說謊版</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game">
    <h1>終極密碼說謊版</h1>

    <div id="menu">
        <p>請選擇範圍</p>
        <button onclick="startGame(20)">1 ~ 20</button>
        <button onclick="startGame(50)">1 ~ 50</button>
        <button onclick="startGame(100)">1 ~ 100</button>
        <button onclick="startGame(200)">1 ~ 200</button>
    </div>

    <div id="game" style="display:none;">
        <p id="range"></p>
        <p id="status"></p>

        <input id="input" type="number" placeholder="輸入猜測">
        <button onclick="guess()">猜測</button>

        <p id="result"></p>
        <p id="cost"></p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
